<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Tile Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a28"/>
      <stop offset="50%" stop-color="#0a0416"/>
      <stop offset="100%" stop-color="#030108"/>
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="40%" stop-color="rgba(0, 240, 255, 0.25)"/>
      <stop offset="70%" stop-color="rgba(168, 85, 247, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>

    <!-- Ambient Aurora Glow -->
    <radialGradient id="aurora" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#ff2d55" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Gyroscope Holographic Rings -->
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5376"/>
      <stop offset="50%" stop-color="#ffd60a"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Core Sphere Radial Gradient -->
    <radialGradient id="sphereBg" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1e0c3e"/>
      <stop offset="60%" stop-color="#0b0317"/>
      <stop offset="100%" stop-color="#04010a"/>
    </radialGradient>

    <!-- Glass Specular Reflection -->
    <radialGradient id="glassSheen" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.75)"/>
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.18)"/>
      <stop offset="70%" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>

    <!-- Clip Path for Sphere Interior -->
    <clipPath id="sphereClip">
      <circle cx="256" cy="256" r="108"/>
    </clipPath>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle App Tile -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="117" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Ambient Aurora Glow Behind Sphere -->
  <circle cx="256" cy="256" r="210" fill="url(#aurora)"/>

  <!-- 3D Holographic Orbit Ring 1 -->
  <ellipse cx="256" cy="256" rx="188" ry="72" fill="none" stroke="url(#ring1)" stroke-width="3.5" transform="rotate(-32 256 256)" opacity="0.9" filter="url(#glow)"/>

  <!-- 3D Holographic Orbit Ring 2 -->
  <ellipse cx="256" cy="256" rx="182" ry="70" fill="none" stroke="url(#ring2)" stroke-width="3" transform="rotate(38 256 256)" opacity="0.75" stroke-dasharray="16 8"/>

  <!-- Satellites on Orbit -->
  <circle cx="395" cy="170" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="395" cy="170" r="14" fill="#00f0ff" opacity="0.4"/>
  <circle cx="116" cy="342" r="7" fill="#ff5376" filter="url(#glow)"/>
  <circle cx="116" cy="342" r="12" fill="#ff5376" opacity="0.4"/>

  <!-- Core Sphere Body -->
  <g clip-path="url(#sphereClip)">
    <circle cx="256" cy="256" r="108" fill="url(#sphereBg)"/>

    <!-- Swirling Plasma Blooms -->
    <circle cx="220" cy="210" r="85" fill="#00f0ff" opacity="0.45" filter="url(#glow)"/>
    <circle cx="295" cy="235" r="90" fill="#ec4899" opacity="0.48" filter="url(#glow)"/>
    <circle cx="250" cy="300" r="80" fill="#a855f7" opacity="0.55" filter="url(#glow)"/>
    <circle cx="275" cy="200" r="55" fill="#ffd60a" opacity="0.32" filter="url(#glow)"/>

    <!-- Dynamic Siri Wave Ribbons -->
    <path d="M 148,256 Q 190,210 230,256 T 310,256 T 364,256" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 148,256 Q 195,300 240,256 T 320,256 T 364,256" fill="none" stroke="#ff2d55" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 148,256 Q 210,195 265,256 T 364,256" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

    <!-- Central Singularity Hot Core -->
    <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.92" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="45" fill="#00f0ff" opacity="0.35"/>
  </g>

  <!-- Crystal Lens Rim & Specular Highlight -->
  <circle cx="256" cy="256" r="108" fill="url(#glassSheen)"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5"/>

  <!-- Starlight Sparkles -->
  <path d="M 112,128 Q 112,142 98,142 Q 112,142 112,156 Q 112,142 126,142 Q 112,142 112,128" fill="#00f0ff" filter="url(#glow)"/>
  <path d="M 398,375 Q 398,386 387,386 Q 398,386 398,397 Q 398,386 409,386 Q 398,386 398,375" fill="#ffd60a" filter="url(#glow)"/>
  <path d="M 405,108 Q 405,116 397,116 Q 405,116 405,124 Q 405,116 413,116 Q 405,116 405,108" fill="#ff5376" filter="url(#glow)"/>
</svg>
